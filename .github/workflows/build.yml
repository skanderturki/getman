name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Upload update site
        uses: actions/upload-artifact@v7
        with:
          name: getman-update-site
          path: releng/com.getman.site/target/com.getman.site-*.zip
          if-no-files-found: error
